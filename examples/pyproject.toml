[project]
name = "rfc8-examples"
version = "0.0.1"
description = "Examples for NGFF RFC-8 collections."
readme = "README.md"
authors = [
    { name = "Tommaso Comparin", email = "tommaso.comparin@exact-lab.it" }
]
requires-python = ">=3.12"
dependencies = [
    "ngio-collections",
    "zarr >= 3.4.0, < 3.5.0",
]

[project.scripts]
example1 = "rfc8_examples.example1:main"
example2 = "rfc8_examples.example2:main"
example3 = "rfc8_examples.example3:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
ngio-collections = { git = "https://github.com/BioVisionCenter/ngio-collections", rev = "23b8fbbcb1453c63611ee683c08c78777fefd25c" }
