[project]
name = "rfc8-examples"
version = "0.0.2"
description = "Examples of NGFF RFC-8 (revision 1) collections for the viewer."
readme = "README.md"
authors = [
    { name = "Tommaso Comparin", email = "tommaso.comparin@exact-lab.it" },
    { name = "Lorenzo Cerrone", email = "lorenzo.cerrone@uzh.ch" }
]
requires-python = ">=3.12"
dependencies = [
    "ngio-collections[validate]",
    "numpy>=2.0",
    "zarr >= 3.4.0, < 3.5.0",
]

[project.scripts]
example1 = "rfc8_examples.example1:main"
example2 = "rfc8_examples.example2:main"
example3 = "rfc8_examples.example3:main"
example4 = "rfc8_examples.example4:main"
example5 = "rfc8_examples.example5:main"
examples-all = "rfc8_examples.run_all:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
# RFC-8 revision 1 support lives on the `rfc8-revision1` branch of ngio-collections.
ngio-collections = { git = "https://github.com/BioVisionCenter/ngio-collections", branch = "rfc8-revision1" }
