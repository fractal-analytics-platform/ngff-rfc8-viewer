<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NGFF RFC-8 collections viewer</title>
  <script type="module" src="./lib/src/main.ts"></script>
  <style>
    body {
      margin: 0;
    }

    #viewer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
  </style>
</head>

<body>
  <div id="viewer"></div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const source = urlParams.get('source');
      const autoload = urlParams.get('autoload');
      let autoloadDepth = 0;
      if (autoload !== null) {
        try {
          autoloadDepth = parseInt(autoload);
        } catch {
        }
      }
      new NGFFViewer('viewer', source, autoloadDepth);
    });
  </script>
</body>

</html>
