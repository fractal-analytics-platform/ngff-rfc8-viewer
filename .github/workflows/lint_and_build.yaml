name: 'Pages'

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions: {}

jobs:
  build:
    name: 'Lint and build'
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install lib dependencies
        run: |
          cd lib
          npm ci

      - name: Check lib
        run: |
          cd lib
          npm run lint

      - name: Build lib
        run: |
          cd lib
          npm run build
